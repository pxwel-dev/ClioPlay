# Scénic III / Mégane armrest console — central switch mapping
#
# Copy to the card as  clio843/cswmap.ini  and edit. This file is re-read at
# helper start (cswd) or within 5 seconds (inline reader), so a change does not
# need a rebuild or a reboot.
#
# Slots
#   btn1..btn9   console buttons, keyed by the record's `source` field
#                  btn1 = top-left soft key      btn2 = back
#                  btn3 = top-right soft key     btn4 = info
#                  btn5 = menu                   btn6 = light
#                  btn7 = repeat                 btn8 = dest
#                  btn9 = map
#   dir1..dir4   joystick up / down / right / left
#   rot1, rot2   knob anticlockwise / clockwise
#   push         knob press
#   longpush     knob press with duration = 2 (unverified on this console)
#
# Actions
#   MAP MENU BACK OK UP DOWN LEFT RIGHT ZOOMOUT ZOOMIN ROTNEXT ROTPREV NONE
#   NONE swallows the key without doing anything.
# ---------------------------------------------------------------------------

# --- console buttons -------------------------------------------------------
btn1=ZOOMOUT
btn2=BACK
btn3=ZOOMIN
btn4=OK
btn5=MENU
btn6=NONE
btn7=NONE
btn8=MENU
btn9=MAP

# --- joystick --------------------------------------------------------------
dir1=UP
dir2=DOWN
dir3=RIGHT
dir4=LEFT

# --- rotary knob -----------------------------------------------------------
# ROTNEXT/ROTPREV zoom the map and step between options elsewhere.
rot2=ROTNEXT
rot1=ROTPREV

# --- knob press ------------------------------------------------------------
push=OK
longpush=BACK
