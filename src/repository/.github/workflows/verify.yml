name: Verify

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verify SHA256SUMS manifest
        if: github.event_name == 'push'
        run: sha256sum -c SHA256SUMS
      - name: Run ClioPlay verification suite
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python3 src/tools/verify_ci.py --host-only
          else
            python3 src/tools/verify_ci.py
          fi
